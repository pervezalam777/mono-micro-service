# Redis Configuration
bind 0.0.0.0
port 6379
protected-mode no
timeout 0
tcp-keepalive 300
daemonize no
supervised no
databases 16

# Logging
loglevel notice
logfile ""

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000

# Security
# requirepass yourpassword
