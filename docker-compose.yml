# Docker Compose Configuration
# Note: API Gateway is for local development only - not deployed to production
version: '3.8'

services:
  # MongoDB for Authentication Service
  mongo:
    image: mongo:7
    container_name: auth-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: mongo-secret
      MONGO_INITDB_DATABASE: auth-db
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - microservices-net

  # PostgreSQL for Author Service
  postgres-author:
    image: postgres:16
    container_name: author-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: author-db
    ports:
      - '5432:5432'
    volumes:
      - postgres-author-data:/var/lib/postgresql/data
    networks:
      - microservices-net

  # PostgreSQL for Book Service
  postgres-book:
    image: postgres:16
    container_name: book-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: book-db
    ports:
      - '5433:5432'
    volumes:
      - postgres-book-data:/var/lib/postgresql/data
    networks:
      - microservices-net

  # Redis for Caching
  redis:
    build:
      context: .
      dockerfile: redis.Dockerfile
    container_name: redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - microservices-net

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: docker/auth-service.Dockerfile
    container_name: auth-service
    restart: always
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://root:mongo-secret@mongo:27017/auth-db?authSource=admin
      - CORS_ORIGIN=http://localhost:5173
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET:-super-secret-key}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:-super-refresh-secret}
      - ACCESS_TOKEN_EXPIRY=15m
      - REFRESH_TOKEN_EXPIRY=7d
    depends_on:
      - mongo
    networks:
      - microservices-net

  # Author Service
  author-service:
    build:
      context: .
      dockerfile: docker/author-service.Dockerfile
    container_name: author-service
    restart: always
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - PORT=3001
      - POSTGRES_HOST=postgres-author
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=author-db
      - CORS_ORIGIN=http://localhost:5173
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
    depends_on:
      - postgres-author
    networks:
      - microservices-net

  # Book Service
  book-service:
    build:
      context: .
      dockerfile: docker/book-service.Dockerfile
    container_name: book-service
    restart: always
    ports:
      - '3002:3002'
    environment:
      - NODE_ENV=production
      - PORT=3002
      - POSTGRES_HOST=postgres-book
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=book-db
      - CORS_ORIGIN=http://localhost:5173
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
    depends_on:
      - postgres-book
    networks:
      - microservices-net

  # API Gateway (for local development only)
  # In production, use a proper API gateway or direct service-to-service communication
  api-gateway:
    build:
      context: .
      dockerfile: docker/api-gateway.Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      - NODE_ENV=development
      - PORT=8000
      - MICROSERVICE_AUTH_URL=http://auth-service:3000
      - MICROSERVICE_AUTHOR_URL=http://author-service:3001
      - MICROSERVICE_BOOK_URL=http://book-service:3002
      - CORS_ORIGIN=http://localhost:5173
      - LOG_LEVEL=info
    depends_on:
      - auth-service
      - author-service
      - book-service
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge

volumes:
  mongo-data:
  postgres-author-data:
  postgres-book-data:
  redis-data:
