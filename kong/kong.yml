# Kong API Gateway Configuration
_format_version: "3.0"

services:
  # Auth Service
  - name: auth-service
    url: http://auth-service:3000
    routes:
      - name: auth-route
        paths:
          - /auth
        strip_path: false
        preserve_host: true
    plugins:
      - name: cors
        config:
          origins:
            - http://localhost:5173
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          headers:
            - Authorization
            - Content-Type
          credentials: true
          max_age: 3600

  # Author Service
  - name: author-service
    url: http://author-service:3001
    routes:
      - name: author-route
        paths:
          - /authors
        strip_path: false
        preserve_host: true
    plugins:
      - name: cors
        config:
          origins:
            - http://localhost:5173
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          headers:
            - Authorization
            - Content-Type
          credentials: true
          max_age: 3600

  # Book Service
  - name: book-service
    url: http://book-service:3002
    routes:
      - name: book-route
        paths:
          - /books
        strip_path: false
        preserve_host: true
    plugins:
      - name: cors
        config:
          origins:
            - http://localhost:5173
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          headers:
            - Authorization
            - Content-Type
          credentials: true
          max_age: 3600

plugins:
  # Rate limiting plugin
  - name: rate-limiting
    config:
      hour: 1000
      minute: 100
      policy: local
    enabled: true